<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Login</title>
</head>
<body>

    <main>
        <section>
            <h2>Login to Your Account</h2>
            
            <!-- The action attribute handles where the form data goes upon submission -->
            <form action="/submit-login" method="POST">
                
                <!-- Email Input Field -->
                <div>
                    <label for="user-email">Email Address:</label>
                    <input type="email" id="user-email" name="email" required placeholder="name@example.com">
                </div>
                
                <br>

                <!-- Password Input Field -->
                <div>
                    <label for="user-password">Password:</label>
                    <input type="password" id="user-password" name="password" required minlength="8">
                </div>

                <br>

                <!-- Remember Me Checkbox -->
                <div>
                    <input type="checkbox" id="remember-me" name="remember">
                    <label for="remember-me">Remember me on this device</label>
                </div>

                <br>

                <!-- Submit Button -->
                <div>
                    <button type="submit">Log In</button>
                </div>

            </form>
        </section>
    </main>

</body>
</html>
